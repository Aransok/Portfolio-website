name: UptimeRobot Sleep Schedule

on:
  schedule:
    # 22:00 UTC = ~1am Bulgaria (EEST, UTC+3) - pause the monitor so the site
    # can spin down on Render's free tier.
    - cron: '0 22 * * *'
    # 03:00 UTC = ~6am Bulgaria - resume monitoring, which also pings the
    # site immediately and wakes it back up.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Manually pause or resume the monitor'
        required: true
        type: choice
        options: [pause, resume]

# Note: cron here is fixed to UTC and doesn't know about DST, so this window
# drifts an hour once Bulgaria falls back to EET (UTC+2) in winter. Also,
# this only needs to fire twice a day (not every few minutes), so GitHub's
# well-documented scheduling delays matter far less here than they did for
# a high-frequency keep-alive ping.

jobs:
  toggle:
    runs-on: ubuntu-latest
    env:
      MONITOR_ID: "803750410"
    steps:
      - name: Determine pause vs resume
        id: determine
        run: |
          if [ "${{ github.event.schedule }}" = "0 22 * * *" ] || [ "${{ github.event.inputs.action }}" = "pause" ]; then
            echo "status=0" >> "$GITHUB_OUTPUT"
            echo "label=pause" >> "$GITHUB_OUTPUT"
          else
            echo "status=1" >> "$GITHUB_OUTPUT"
            echo "label=resume" >> "$GITHUB_OUTPUT"
          fi

      - name: Call UptimeRobot API
        run: |
          response=$(curl -s -X POST https://api.uptimerobot.com/v2/editMonitor \
            -d "api_key=${{ secrets.UPTIMEROBOT_API_KEY }}" \
            -d "id=$MONITOR_ID" \
            -d "status=${{ steps.determine.outputs.status }}" \
            -d "format=json")
          echo "Action: ${{ steps.determine.outputs.label }}"
          echo "Response: $response"
          echo "$response" | grep -q '"stat":"ok"' || (echo "::error::UptimeRobot API call failed" && exit 1)
