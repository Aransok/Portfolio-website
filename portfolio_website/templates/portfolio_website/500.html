{% extends "portfolio_website/base.html" %}

{% block title %}500 | Doan Idriz{% endblock %}

{% block content %}
<div class="wrap">
    <section class="error-page">
        <span class="error-code">500</span>
        <h1>Server error</h1>
        <p>Something broke on my side. It's logged; taking you back home.</p>
        <p>Redirecting in <span id="countdown">5</span> seconds, or <a href="/">go home now</a>.</p>
    </section>
</div>

<script>
    (function () {
        var countdown = 5;
        var el = document.getElementById("countdown");
        var interval = setInterval(function () {
            countdown--;
            el.textContent = countdown;
            if (countdown <= 0) {
                clearInterval(interval);
                window.location.href = "/";
            }
        }, 1000);
    })();
</script>
{% endblock %}
