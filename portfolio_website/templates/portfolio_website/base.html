{%load static%}
<html lang="en">

<body>

        <nav>
            <a href="{% url 'home' %}" class="brand">Doan <span>Idriz</span></a>

                <li><a href="{% url 'about' %}">About</a></li>

            <a href="https://www.linkedin.com/in/doan-idriz-70b472165/" target="_blank">
                <img src="{% static 'media/icons8-linkedin-48.png' %}" alt="LinkedIn">
            </a>
            <a href="https://github.com/Aransok" target="_blank">
                <img src="{% static 'media/icons8-github-48.png' %}" alt="GitHub">
