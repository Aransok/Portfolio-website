{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New portfolio message</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#ffffff; border-radius:14px; overflow:hidden; box-shadow:0 4px 16px rgba(20,25,35,0.08);">

        <tr>
          <td style="background:linear-gradient(135deg,#6ea8fe,#7ee2c9); padding:28px 32px;">
            <p style="margin:0; font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#0d1117;">Portfolio Contact Form</p>
            <h1 style="margin:6px 0 0; font-size:22px; font-weight:700; color:#0d1117;">New message from {{ sender_name }}</h1>
          </td>
        </tr>

        <tr>
          <td style="padding:28px 32px 8px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding:4px 0; font-size:13px; color:#8b949e; width:80px;">From</td>
                <td style="padding:4px 0; font-size:14px; color:#161b22; font-weight:600;">{{ sender_name }}</td>
              </tr>
              <tr>
                <td style="padding:4px 0; font-size:13px; color:#8b949e;">Email</td>
                <td style="padding:4px 0; font-size:14px;"><a href="mailto:{{ sender_email }}" style="color:#3f7ce0; text-decoration:none;">{{ sender_email }}</a></td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:16px 32px 32px;">
            <div style="background-color:#f4f5f7; border-radius:10px; padding:20px 22px; font-size:15px; line-height:1.6; color:#24292f; white-space:pre-wrap;">{{ message_body }}</div>
          </td>
        </tr>

        <tr>
          <td style="padding:18px 32px; background-color:#f9fafb; border-top:1px solid #eaecef;">
            <a href="mailto:{{ sender_email }}?subject=Re:%20Your%20message" style="display:inline-block; background:linear-gradient(135deg,#6ea8fe,#7ee2c9); color:#0d1117; font-weight:600; font-size:14px; text-decoration:none; padding:10px 22px; border-radius:999px;">Reply to {{ sender_name }}</a>
          </td>
        </tr>

      </table>
      <p style="margin:16px 0 0; font-size:12px; color:#9aa1ac;">Sent automatically from the contact form at doanidriz's portfolio.</p>
    </td>
  </tr>
</table>
</body>
</html>
